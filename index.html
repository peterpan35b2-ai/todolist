<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Tailwind</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .completed { text-decoration: line-through; opacity: 0.6; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex flex-col items-center py-6">

  <h1 class="text-2xl font-bold text-blue-600 mb-4">My Tasks</h1>

  <div class="bg-white dark:bg-gray-800 w-11/12 max-w-md rounded-xl p-4 shadow">
    <!-- Input -->
    <div class="flex gap-2 mb-4">
      <input id="taskInput" type="text" placeholder="What do you need to do?"
        class="flex-1 rounded-lg border border-gray-300 dark:border-gray-700 p-3 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <button id="addBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 rounded-lg font-bold">Add</button>
    </div>

    <!-- Task List -->
    <ul id="taskList" class="space-y-2"></ul>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addBtn = document.getElementById('addBtn');
    const taskList = document.getElementById('taskList');

    // Lấy tasks từ localStorage hoặc tạo mới
    let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

    // Lưu tasks vào localStorage
    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    // Render danh sách tasks
    function renderTasks() {
      taskList.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `flex justify-between items-center p-3 rounded-lg border ${
          task.completed ? 'completed border-gray-300 dark:border-gray-700 bg-gray-100 dark:bg-gray-700' : 'border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800'
        }`;

        li.innerHTML = `
          <span>${task.text}</span>
          <div class="flex gap-2">
            <button onclick="toggleTask(${index})" class="text-green-600 hover:text-green-400">✔️</button>
            <button onclick="deleteTask(${index})" class="text-red-600 hover:text-red-400">🗑️</button>
          </div>
        `;
        taskList.appendChild(li);
      });
    }

    // Thêm task mới
    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return alert('Please enter a task!');
      tasks.push({ text, completed: false });
      taskInput.value = '';
      saveTasks();
      renderTasks();
    }

    // Đánh dấu hoàn thành
    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      saveTasks();
      renderTasks();
    }

    // Xóa task
    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    // Event listeners
    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') addTask();
    });

    // Initial render
    renderTasks();

    // Expose functions cho inline onclick
    window.toggleTask = toggleTask;
    window.deleteTask = deleteTask;
  </script>

</body>
</html>
